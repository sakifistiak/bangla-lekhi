[package]
name = "bangla_lekhi_core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Bangla Lekhi Contributors"]

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
okkhor = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ahash = "0.8"
upodesh = "0.4.0"

[dev-dependencies]
pretty_assertions = "1.4"
