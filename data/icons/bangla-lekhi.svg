<?xml version="1.0" encoding="UTF-8"?>
<!--
  Bangla Lekhi Application Icon
  Bengali letter "ব" (Ba) stylized as the app logo
  License: GPL-3.0-or-later
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>
  <!-- Bengali letter ব (Ba) centered -->
  <text
    x="32"
    y="46"
    font-family="Noto Sans Bengali, Kalpurush, serif"
    font-size="38"
    font-weight="bold"
    text-anchor="middle"
    fill="url(#text_grad)"
    dominant-baseline="auto">ব</text>
</svg>
